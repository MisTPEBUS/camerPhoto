<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Photo Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="flex w-[1296px] shadow-lg bg-white rounded-lg overflow-hidden flex-wrap">

        <!-- 左側：攝影機畫面 -->
        <div class="w-2/3 bg-gray-800 flex justify-center items-center">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
        </div>

        <!-- 右側：輸入框與按鈕 -->
        <div class="w-1/3 bg-gray-100 p-6 flex flex-col justify-between">
            <!-- 輸入框區域 -->
            <div>
                <label for="employeeId" class="block text-lg font-medium text-gray-700 mb-2">
                    請輸入員工編號
                </label>
                <input type="text" id="employeeId" placeholder="員工編號"
                    class="w-full border border-gray-300 rounded-md shadow-sm p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- 按鈕區域 -->
            <div class="space-y-4">
                <button id="Login"
                    class="block w-full bg-blue-500 text-white font-semibold py-3 rounded-md hover:bg-blue-600 active:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onclick="setButtonStatus('Login')">
                    簽到
                </button>
                <button id="Logout"
                    class="block w-full bg-blue-500 text-white font-semibold py-3 rounded-md hover:bg-blue-600 active:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onclick="setButtonStatus('Logout')">
                    簽退
                </button>
                <button id="Goout"
                    class="block w-full bg-blue-500 text-white font-semibold py-3 rounded-md hover:bg-blue-600 active:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onclick="setButtonStatus('Goout')">
                    公出
                </button>
                <button id="Goin"
                    class="block w-full bg-blue-500 text-white font-semibold py-3 rounded-md hover:bg-blue-600 active:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onclick="setButtonStatus('Goin')">
                    公入
                </button>
            </div>

            <!-- 拍照按鈕 -->
            <button id="capture"
                class="block w-full bg-red-500 text-white font-semibold py-3 rounded-md hover:bg-red-600 active:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500"
                onclick="captureAndUpload()">
                拍照
            </button>
        </div>

        <!-- LOG 區域 -->
        <div class="w-full">
            <textarea id="log" readonly class="w-full h-[120px] border border-gray-300 p-2 mt-4"
                placeholder="日誌記錄將顯示在這裡..."></textarea>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const employeeIdInput = document.getElementById('employeeId');
        const logTextarea = document.getElementById('log');
        let selectedAction = null; // 記錄當前選擇的按鈕動作

        // 啟動攝影機
        async function startCamera() {
            /* const stream = await navigator.mediaDevices.getUserMedia({ video: true }); */
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
        }

        // 設定按鈕狀態
        function setButtonStatus(action) {
            selectedAction = action; // 記錄選擇的動作
            document.querySelectorAll('button[id]').forEach((btn) => {
                if (btn.id === action) {
                    btn.classList.add('bg-blue-700', 'text-white');
                    btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                } else {
                    btn.classList.remove('bg-blue-700', 'text-white');
                    btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
                }
            });
        }

        // 拍照並上傳
        async function captureAndUpload() {
            const employeeId = employeeIdInput.value.trim();
            if (!employeeId) {
                alert('請輸入員工編號！');
                return;
            }
            if (!selectedAction) {
                alert('請選擇一個操作（簽到、簽退、公出、公入）！');
                return;
            }

            // 拍照
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg'); // 照片為 JPEG

            // 上傳
            const res = await fetch('/api/upload-photo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    imageData,
                    employeeId,
                    btn: selectedAction,
                }),
            });
            const result = await res.json();
            if (result.success) {
                alert('上傳成功！');
                updateLog();
            } else {
                alert('上傳失敗：' + result.error);
            }
        }

        // 更新 LOG
        async function updateLog() {
            const res = await fetch('/api/get-log');
            const result = await res.json();
            if (result.success) {
                logTextarea.value = result.log;
            }
        }

        // 初始化
        window.addEventListener('load', () => {
            startCamera();
            updateLog();
        });
    </script>
</body>

</html>
